services:
  mongo:
    image: mongo:6.0
    container_name: biograph-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: biograph-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  mongo_data: