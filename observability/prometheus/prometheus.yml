# ============================================================
# Prometheus configuration for BioGraph microservices
# ============================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'biograph'
    environment: 'development'

# ============================================================
# ALERTING – connect to Alertmanager
# ============================================================
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
      timeout: 10s

# ============================================================
# RULE FILES – alert rules and recording rules
# ============================================================
rule_files:
  - '/etc/prometheus/rules/*.yml'

# ============================================================
# SCRAPE CONFIGS
# ============================================================
scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  - job_name: 'api-gateway'
    metrics_path: /metrics
    static_configs:
      - targets: ['api-gateway:5000']
        labels:
          service: 'api-gateway'
          tier: 'edge'

  - job_name: 'auth-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['auth-service:5001']
        labels:
          service: 'auth-service'
          tier: 'core'

  - job_name: 'entity-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['entity-service:5003']
        labels:
          service: 'entity-service'
          tier: 'core'

  - job_name: 'research-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['research-service:5004']
        labels:
          service: 'research-service'
          tier: 'core'

  - job_name: 'research-worker'
    metrics_path: /metrics
    static_configs:
      - targets: ['research-worker:9101']
        labels:
          service: 'research-worker'
          tier: 'worker'

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'cadvisor'
          tier: 'infra'