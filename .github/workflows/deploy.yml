# ============================================================
# Manual deployment workflow – triggered from GitHub UI.
# Pulls latest images and restarts the stack on a remote server.
# ============================================================
name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      image_tag:
        description: 'Image tag to deploy (sha-xxxxxxx or latest)'
        required: false
        default: 'latest'

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH || '/opt/biograph' }}

            echo "📥 Pulling latest code..."
            git pull origin main

            echo "🔐 Logging into GHCR..."
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "⬇️  Pulling images (tag: ${{ inputs.image_tag }})..."
            export IMAGE_TAG=${{ inputs.image_tag }}
            docker compose pull

            echo "🔄 Restarting stack..."
            docker compose up -d --remove-orphans

            echo "⏳ Waiting for health checks..."
            sleep 10
            docker compose ps

            echo "✅ Deployment to ${{ inputs.environment }} complete"
