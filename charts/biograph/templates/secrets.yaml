apiVersion: v1
kind: Secret
metadata:
  name: biograph-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "biograph.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwt-secret: {{ .Values.secrets.jwtSecret | quote }}
  qdrant-api-key: {{ .Values.secrets.qdrantApiKey | quote }}
  neo4j-password: {{ .Values.secrets.neo4jPassword | quote }}
  openai-api-key: {{ .Values.secrets.openaiApiKey | quote }}
  ncbi-api-key: {{ .Values.secrets.ncbiApiKey | quote }}
  slack-webhook-url: {{ .Values.secrets.slackWebhookUrl | quote }}