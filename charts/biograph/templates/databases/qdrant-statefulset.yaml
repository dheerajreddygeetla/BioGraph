{{- if .Values.qdrant.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "biograph.labels" . | nindent 4 }}
    app.kubernetes.io/name: qdrant
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: qdrant
  ports:
    - port: 6333
      name: http
    - port: 6334
      name: grpc
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "biograph.labels" . | nindent 4 }}
    app.kubernetes.io/name: qdrant
spec:
  serviceName: qdrant
  replicas: {{ .Values.qdrant.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: qdrant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qdrant
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: qdrant
          image: {{ .Values.qdrant.image }}
          env:
            - name: QDRANT__SERVICE__API_KEY
              valueFrom:
                secretKeyRef:
                  name: biograph-secrets
                  key: qdrant-api-key
          ports:
            - containerPort: 6333
              name: http
            - containerPort: 6334
              name: grpc
          volumeMounts:
            - name: qdrant-data
              mountPath: /qdrant/storage
          resources:
            {{- toYaml .Values.qdrant.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 6333
            initialDelaySeconds: 15
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: qdrant-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.qdrant.storage }}
{{- end }}